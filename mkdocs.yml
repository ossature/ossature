site_name: Ossature Documentation
site_description: An open-source harness for spec-driven code generation
site_url: https://ossature.dev

repo_name: ossature/ossature
repo_url: https://github.com/ossature/ossature

theme:
  name: material
  custom_dir: docs/overrides
  # logo: assets/ossature.png
  palette:
    scheme: default
    primary: black
    accent: black
  font:
    text: Inter
    code: SFMono-Regular
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - offline
  - redirects:
      redirect_maps:
        getting-started/installation.md: first-steps/installation.md
        getting-started/quickstart.md: first-steps/your-first-project.md
        getting-started/workflow.md: tutorials/01-init-and-config.md
        cli/commands.md: reference/cli.md
        specs/smd.md: reference/smd-format.md
        specs/amd.md: reference/amd-format.md
        specs/overview.md: topics/how-validation-works.md
        configuration/ossature-toml.md: reference/configuration.md
        advanced/build-system.md: topics/how-the-build-works.md
        advanced/context.md: topics/context-files.md
        advanced/multi-spec.md: topics/interfaces-and-boundaries.md

exclude_docs: |
  README.md
  _inventory.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - admonition
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ossature/ossature

nav:
  - Home: index.md
  - First Steps:
      - first-steps/installation.md
      - first-steps/your-first-project.md
  - Tutorials:
      - tutorials/index.md
      - tutorials/01-init-and-config.md
      - tutorials/02-writing-specs.md
      - tutorials/03-validate-and-audit.md
      - tutorials/04-reviewing-the-plan.md
      - tutorials/05-build-and-iterate.md
  - Topics:
      - topics/index.md
      - topics/how-validation-works.md
      - topics/how-the-build-works.md
      - topics/invalidation.md
      - topics/interfaces-and-boundaries.md
      - topics/context-files.md
  - How-to:
      - how-to/index.md
  - Reference:
      - reference/index.md
      - reference/cli.md
      - reference/smd-format.md
      - reference/amd-format.md
      - reference/configuration.md
      - reference/plan-toml.md
      - reference/state-toml.md
      - reference/ossature-directory.md
